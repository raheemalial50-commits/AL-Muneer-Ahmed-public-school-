<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="school-icon">
          <i class="fas fa-school"></i>
        </div>
        <h1>THE SMART MODERN PUBLIC SCHOOL QAMBER</h1>
        <p>School Management System</p>
      </div>

      <div id="loginAlert" class="alert alert-danger" style="display:none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username / Email</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePass" aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-check">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember Me</label>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="login-footer">
        <a href="#" id="forgotLink">Forgot Password?</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    const remembered = localStorage.getItem('sms_remember');
    if (remembered) {
      document.getElementById('username').value = remembered;
      document.getElementById('rememberMe').checked = true;
    }

    document.getElementById('togglePass').addEventListener('click', function() {
      const pass = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pass.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      const alertEl = document.getElementById('loginAlert');

      const result = login(username, password, remember);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        alertEl.textContent = result.message || 'Login failed';
        alertEl.style.display = 'block';
      }
    });

    document.getElementById('forgotLink').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Please contact the school administrator to reset your password.');
    });
  </script>
</body>
</html>
